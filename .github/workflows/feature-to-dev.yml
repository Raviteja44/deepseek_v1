name: 1. Promote Feature Branch to Dev

on:
  workflow_dispatch:
    inputs:
      feature_branch:
        description: "Feature branch name (e.g., feature/edp_opt_JIRA-123)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote-to-dev:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate feature branch exists
        id: validate-branch
        run: |
          FEATURE_BRANCH="${{ github.event.inputs.feature_branch }}"
          
          if ! git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" > /dev/null 2>&1; then
            echo "Error: Feature branch '$FEATURE_BRANCH' does not exist on remote"
            exit 1
          fi
          
          git fetch origin "$FEATURE_BRANCH"
          echo "branch_name=$FEATURE_BRANCH" >> $GITHUB_OUTPUT

      - name: Extract JIRA ID from branch name
        id: extract-jira
        run: |
          FEATURE_BRANCH="${{ steps.validate-branch.outputs.branch_name }}"
          JIRA_ID=$(echo "$FEATURE_BRANCH" | grep -io "JIRA-[0-9]\+" | head -1)
          
          if [ -z "$JIRA_ID" ]; then
            echo "Error: No JIRA ID found in branch name '$FEATURE_BRANCH'"
            echo "Branch name must contain JIRA-123 pattern"
            exit 1
          fi
          
          echo "jira_id=$JIRA_ID" >> $GITHUB_ENV
          echo "jira_id_output=$JIRA_ID" >> $GITHUB_OUTPUT

      - name: Check for differences with dev
        id: check-diff
        run: |
          FEATURE_BRANCH="${{ steps.validate-branch.outputs.branch_name }}"
          
          if git diff --quiet origin/dev...origin/"$FEATURE_BRANCH"; then
            echo "No differences found between dev and $FEATURE_BRANCH"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "has_changes=true" >> $GITHUB_ENV
            
            FILE_COUNT=$(git diff --name-only origin/dev...origin/"$FEATURE_BRANCH" | wc -l)
            echo "file_count=$FILE_COUNT" >> $GITHUB_ENV
            
            CHANGED_FILES=$(git diff --name-only origin/dev...origin/"$FEATURE_BRANCH")
            echo "changed_files<<EOF" >> $GITHUB_ENV
            echo "$CHANGED_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            COMMIT_MESSAGES=$(git log --oneline origin/dev...origin/"$FEATURE_BRANCH")
            echo "commit_messages<<EOF" >> $GITHUB_ENV
            echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Stop if no changes
        if: env.has_changes == 'false'
        run: |
          echo "No changes to promote. Stopping workflow."
          exit 0

      - name: Check for merge conflicts
        run: |
          FEATURE_BRANCH="${{ steps.validate-branch.outputs.branch_name }}"
          
          # Create test merge branch
          git checkout -b test-merge-branch dev
          
          # Try to merge feature branch into test branch
          if git merge --no-commit --no-ff "origin/$FEATURE_BRANCH" 2>&1 | grep -q "CONFLICT"; then
            echo "Merge conflicts detected. Please resolve conflicts between dev and $FEATURE_BRANCH"
            git merge --abort
            exit 1
          else
            echo "No merge conflicts detected"
            git merge --abort
          fi
          
          # Clean up
          git checkout dev
          git branch -D test-merge-branch

      - name: Create PR from feature branch to dev
        id: create-pr
        run: |
          FEATURE_BRANCH="${{ steps.validate-branch.outputs.branch_name }}"
          JIRA_ID="${{ env.jira_id }}"
          PR_TITLE="[$JIRA_ID] Promote changes from $FEATURE_BRANCH to dev"
          
          PR_BODY="## Promotion Request: $FEATURE_BRANCH -> dev
          
          JIRA ID: $JIRA_ID
          Source Branch: $FEATURE_BRANCH
          Target Branch: dev
          Changed Files: ${{ env.file_count }} files
          
          Changed Files:
          \`\`\`
          ${{ env.changed_files }}
          \`\`\`
          
          Commit Messages:
          \`\`\`
          ${{ env.commit_messages }}
          \`\`\`
          
          Important Notes:
          1. PR ID: #[NEXT] (Will be auto-filled after PR creation)
          2. After merge, note the Merge Commit SHA for promotion
          3. Ensure dev testing is completed before promoting to UAT
          
          Promotion Chain: Feature -> dev -> UAT -> Prod
          
          Automatically generated by GitHub Actions"
          
          PR_RESULT=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base dev \
            --head "$FEATURE_BRANCH" \
            --label "feature-to-dev" \
            --label "$JIRA_ID" \
            --output json 2>&1)
          
          if echo "$PR_RESULT" | grep -q "number"; then
            PR_NUMBER=$(echo "$PR_RESULT" | jq -r '.number')
            PR_URL=$(echo "$PR_RESULT" | jq -r '.url')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          else
            echo "Failed to create PR:"
            echo "$PR_RESULT"
            exit 1
          fi

      - name: Update PR body with actual PR ID
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          
          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          UPDATED_BODY=$(echo "$CURRENT_BODY" | sed "s/#\[NEXT\]/#$PR_NUMBER/g")
          
          gh pr edit "$PR_NUMBER" --body "$UPDATED_BODY"