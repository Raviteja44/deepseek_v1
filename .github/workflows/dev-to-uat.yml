name: 3. Promote Dev → UAT

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into dev"
        required: true
        type: number
      source_branch:
        description: "Source branch: dev"
        required: true
        type: choice
        options:
          - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup environment
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"
          if [ -z "$PR" ]; then
            echo "Error: PR number cannot be empty." >&2
            exit 1
          fi

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          ERR=$(echo "$PR_JSON" | jq -r '.message // empty')
          if [ -n "$ERR" ]; then
            echo "Error: PR #$PR not found. API message: $ERR" >&2
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')

          if [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR is not merged." >&2
            exit 1
          fi

          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "Error: PR #$PR must have been merged into dev (found: $BASE_BRANCH)." >&2
            exit 1
          fi

          if [ -z "$MERGE_COMMIT" ] || [ "$MERGE_COMMIT" = "null" ]; then
            echo "Error: Could not get merge commit SHA for PR #$PR"
            exit 1
          fi

          echo "pr_number=$PR" >> $GITHUB_OUTPUT
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT

      - name: Extract Jira ID
        run: |
          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.validate.outputs.pr_number }}")

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          JIRA_ID=$(echo "$TITLE" | grep -oE "\[?JIRA-[0-9]+\]?" | head -1 | tr -d '[]' || echo "")
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID=$(echo "$BODY" | grep -oE "JIRA-[0-9]+" | head -1 || echo "")
          fi
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID="PR-${{ steps.validate.outputs.pr_number }}"
          fi

          echo "jira_id=$JIRA_ID" >> $GITHUB_ENV

      - name: Get changes from merge commit
        id: get-changes
        run: |
          PARENT_DEV=$(git log --pretty=%P -n 1 "${{ steps.validate.outputs.merge_commit }}" | awk '{print $1}')
          FEATURE_COMMIT=$(git log --no-merges --pretty=format:"%H" "$PARENT_DEV".."${{ steps.validate.outputs.merge_commit }}" | head -1)
          
          echo "parent_commit=$PARENT_DEV" >> $GITHUB_OUTPUT
          echo "feature_commit=$FEATURE_COMMIT" >> $GITHUB_OUTPUT
          
          COMMIT_MSG_FILE=$(mktemp)
          git log --oneline "$PARENT_DEV".."${{ steps.validate.outputs.merge_commit }}" > "$COMMIT_MSG_FILE"
          COMMIT_MSGS=$(cat "$COMMIT_MSG_FILE")
          echo "commit_messages=$COMMIT_MSGS" >> $GITHUB_ENV

      - name: Check if changes already in UAT
        run: |
          git fetch origin uat
          if git merge-base --is-ancestor "${{ steps.validate.outputs.merge_commit }}" origin/uat; then
            echo "Changes already in UAT, exiting..."
            exit 0
          fi

      - name: Create promotion branch
        id: create_branch
        run: |
          TS=$(date +%s)
          BRANCH="promote/${{ env.jira_id }}-pr${{ steps.validate.outputs.pr_number }}-${TS}"
          
          git fetch origin uat
          git checkout -b "$BRANCH" origin/uat
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Apply changes
        id: apply_changes
        run: |
          if git cherry-pick -x "${{ steps.get-changes.outputs.feature_commit }}"; then
            echo "changes_applied=true" >> $GITHUB_OUTPUT
            echo "conflict_resolved=false" >> $GITHUB_OUTPUT
          else
            CONFLICTED_FILES=$(git status --porcelain | grep -E '^(UU|AA)' | cut -c4-)
            for FILE in $CONFLICTED_FILES; do
              git checkout "${{ steps.get-changes.outputs.feature_commit }}" -- "$FILE" 2>/dev/null && git add "$FILE"
            done
            
            if git cherry-pick --continue; then
              echo "changes_applied=true" >> $GITHUB_OUTPUT
              echo "conflict_resolved=true" >> $GITHUB_OUTPUT
            else
              git cherry-pick --abort
              echo "changes_applied=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

      - name: Prepare PR body
        id: prepare_body
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          
          CONFLICT_NOTE=""
          if [ "${{ steps.apply_changes.outputs.conflict_resolved }}" = "true" ]; then
            CONFLICT_NOTE="Note: Conflicts were automatically resolved during cherry-pick"
          fi
          
          BODY_CONTENT="Automated Promotion PR\n\nJira ID: ${{ env.jira_id }}\nSource PR: #${{ steps.validate.outputs.pr_number }} (merged into dev)\nDev Merge Commit: ${{ steps.validate.outputs.merge_commit }}\nFeature Commit Applied: ${{ steps.get-changes.outputs.feature_commit }}\nTarget branch: uat\nPromotion branch: $BR\n$CONFLICT_NOTE\n\nCommit messages from source:\n${{ env.commit_messages }}\n\nA PR ID reference will be added below for future uat → prod promotions."
          
          echo "$BODY_CONTENT" > pr_body.txt
          echo "body_content=$BODY_CONTENT" >> $GITHUB_ENV

      - name: Push branch
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          git push origin "HEAD:$BR"

      - name: Create PR
        id: create_pr
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          PR_TITLE="[${{ env.jira_id }}] Promote changes from dev to uat (PR #${{ steps.validate.outputs.pr_number }})"
          
          # Escape the body content for JSON
          BODY_ESCAPED=$(echo "${{ env.body_content }}" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"$PR_TITLE\",\"head\":\"$BR\",\"base\":\"uat\",\"body\":\"$BODY_ESCAPED\"}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls")
          
          PR_NUM=$(echo "$RESPONSE" | jq -r '.number')
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "Failed to create PR"
            exit 1
          fi
          
          echo "created_pr=$PR_NUM" >> $GITHUB_OUTPUT
          
          UPDATED_BODY="${BODY_ESCAPED}\\n\\nUAT PR ID: ${PR_NUM}\\nRetain this ID for uat → prod promotions."
          
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$UPDATED_BODY\"}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUM}" > /dev/null
          
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"labels":["dev-to-uat","automated-promotion"]}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUM}/labels" > /dev/null

      - name: Completion
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          echo "Promotion Dev → UAT completed successfully."
          echo "UAT PR #${{ steps.create_pr.outputs.created_pr }} created"
