name: 3. Promote Dev → UAT

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into dev"
        required: true
        type: number
      source_branch:
        description: "Source branch: dev"
        required: true
        type: choice
        options:
          - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup environment
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"
          if [ -z "$PR" ]; then
            echo "Error: PR number cannot be empty." >&2
            exit 1
          fi

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          ERR=$(echo "$PR_JSON" | jq -r '.message // empty')
          if [ -n "$ERR" ]; then
            echo "Error: PR #$PR not found. API message: $ERR" >&2
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')

          if [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR is not merged." >&2
            exit 1
          fi

          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "Error: PR #$PR must have been merged into dev (found: $BASE_BRANCH)." >&2
            exit 1
          fi

          if [ -z "$MERGE_COMMIT" ] || [ "$MERGE_COMMIT" = "null" ]; then
            echo "Error: Could not get merge commit SHA for PR #$PR"
            exit 1
          fi

          echo "pr_number=$PR" >> $GITHUB_OUTPUT
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT

      - name: Extract Jira ID
        run: |
          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.validate.outputs.pr_number }}")

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          JIRA_ID=$(echo "$TITLE" | grep -oE "\[?JIRA-[0-9]+\]?" | head -1 | tr -d '[]' || echo "")
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID=$(echo "$BODY" | grep -oE "JIRA-[0-9]+" | head -1 || echo "")
          fi
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID="PR-${{ steps.validate.outputs.pr_number }}"
          fi

          echo "jira_id=$JIRA_ID" >> $GITHUB_ENV

      - name: Get changes from merge commit
        id: get-changes
        run: |
          PARENT_DEV=$(git log --pretty=%P -n 1 "${{ steps.validate.outputs.merge_commit }}" | awk '{print $1}')
          FEATURE_COMMIT=$(git log --no-merges --pretty=format:"%H" "$PARENT_DEV".."${{ steps.validate.outputs.merge_commit }}" | head -1)
          
          echo "parent_commit=$PARENT_DEV" >> $GITHUB_OUTPUT
          echo "feature_commit=$FEATURE_COMMIT" >> $GITHUB_OUTPUT
          
          # Store commit messages properly with multi-line support
          echo "commit_messages<<EOF" >> $GITHUB_ENV
          git log --oneline "$PARENT_DEV".."${{ steps.validate.outputs.merge_commit }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only "$PARENT_DEV" "${{ steps.validate.outputs.merge_commit }}")
          FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_ENV
          echo "$CHANGED_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Check if changes already in UAT
        run: |
          git fetch origin uat
          if git merge-base --is-ancestor "${{ steps.validate.outputs.merge_commit }}" origin/uat; then
            echo "Changes already in UAT, exiting..."
            exit 0
          fi

      - name: Create promotion branch
        id: create_branch
        run: |
          TS=$(date +%s)
          BRANCH="promote/${{ env.jira_id }}-pr${{ steps.validate.outputs.pr_number }}-${TS}"
          
          git fetch origin uat
          git checkout -b "$BRANCH" origin/uat
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Apply changes with full conflict resolution
        id: apply_changes
        run: |
          if git cherry-pick -x "${{ steps.get-changes.outputs.feature_commit }}"; then
            echo "changes_applied=true" >> $GITHUB_OUTPUT
            echo "conflict_resolved=false" >> $GITHUB_OUTPUT
          else
            echo "Failed to cherry-pick, analyzing conflict type..."
            
            # Get detailed conflict information
            CONFLICTED_FILES=$(git status --porcelain | grep -E '^(UU|AA|DD|AU|UD|UA|DU)' | cut -c4-)
            
            if [ -n "$CONFLICTED_FILES" ]; then
              echo "Conflicts detected in files:"
              echo "$CONFLICTED_FILES"
              
              # Resolve each conflict based on type
              RESOLVED=true
              
              git status --porcelain | while read line; do
                STATUS=$(echo "$line" | cut -c1-2)
                FILE=$(echo "$line" | cut -c4-)
                
                echo "Processing: $FILE (status: $STATUS)"
                
                case $STATUS in
                  "UU"|"AA")
                    # Both modified - use feature branch version
                    echo "  Both modified conflict - using feature branch version"
                    git checkout "${{ steps.get-changes.outputs.feature_commit }}" -- "$FILE" 2>/dev/null || {
                      echo "  Warning: Could not checkout $FILE from feature commit"
                      RESOLVED=false
                    }
                    git add "$FILE"
                    ;;
                  "DD")
                    # Both deleted - remove file
                    echo "  Both deleted - removing file"
                    git rm "$FILE" 2>/dev/null || {
                      echo "  Warning: Could not remove $FILE"
                      RESOLVED=false
                    }
                    ;;
                  "AU")
                    # Added by us, deleted by them - keep our addition
                    echo "  File added by us, deleted by them - keeping addition"
                    # Do nothing, keep our version
                    git add "$FILE"
                    ;;
                  "UD")
                    # Modified by us, deleted by them - delete file
                    echo "  File modified by us, deleted by them - deleting file"
                    git rm "$FILE" 2>/dev/null || {
                      echo "  Warning: Could not remove $FILE"
                      RESOLVED=false
                    }
                    ;;
                  "UA")
                    # Deleted by us, added by them - add their version
                    echo "  File deleted by us, added by them - adding their version"
                    git checkout "${{ steps.get-changes.outputs.feature_commit }}" -- "$FILE" 2>/dev/null || {
                      echo "  Warning: Could not checkout $FILE from feature commit"
                      RESOLVED=false
                    }
                    git add "$FILE"
                    ;;
                  "DU")
                    # Deleted by us, modified by them - SPECIAL CASE: modify/delete conflict
                    # Since UAT is the target and we're promoting from dev, we should
                    # accept the modification from dev (feature branch)
                    echo "  File deleted in UAT, modified in dev - adding modification from dev"
                    git checkout "${{ steps.get-changes.outputs.feature_commit }}" -- "$FILE" 2>/dev/null || {
                      echo "  Warning: Could not checkout $FILE from feature commit"
                      RESOLVED=false
                    }
                    git add "$FILE"
                    ;;
                  *)
                    echo "  Unknown conflict status: $STATUS"
                    RESOLVED=false
                    ;;
                esac
              done
              
              if [ "$RESOLVED" = "true" ]; then
                echo "All conflicts resolved, continuing cherry-pick..."
                if git cherry-pick --continue; then
                  echo "Successfully resolved conflicts and completed cherry-pick"
                  echo "changes_applied=true" >> $GITHUB_OUTPUT
                  echo "conflict_resolved=true" >> $GITHUB_OUTPUT
                else
                  echo "Could not continue after conflict resolution"
                  git cherry-pick --abort
                  echo "changes_applied=false" >> $GITHUB_OUTPUT
                  exit 1
                fi
              else
                echo "Could not resolve all conflicts, aborting"
                git cherry-pick --abort
                echo "changes_applied=false" >> $GITHUB_OUTPUT
                exit 1
              fi
            else
              echo "No conflict markers found, unknown error"
              git cherry-pick --abort
              echo "changes_applied=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

      - name: Prepare PR body
        id: prepare_body
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          
          CONFLICT_NOTE=""
          if [ "${{ steps.apply_changes.outputs.conflict_resolved }}" = "true" ]; then
            CONFLICT_NOTE="Note: Conflicts were automatically resolved during cherry-pick"
          fi
          
          # Build the PR body with proper formatting
          {
            echo "Automated Promotion PR"
            echo ""
            echo "Jira ID: ${{ env.jira_id }}"
            echo "Source PR: #${{ steps.validate.outputs.pr_number }} (merged into dev)"
            echo "Dev Merge Commit: ${{ steps.validate.outputs.merge_commit }}"
            echo "Feature Commit Applied: ${{ steps.get-changes.outputs.feature_commit }}"
            echo "Target branch: uat"
            echo "Promotion branch: $BR"
            if [ -n "$CONFLICT_NOTE" ]; then
              echo "$CONFLICT_NOTE"
            fi
            echo ""
            echo "Changes identified: ${{ steps.get-changes.outputs.file_count }} files"
            echo ""
            if [ -n "${{ env.changed_files }}" ]; then
              echo "Changed files:"
              echo "${{ env.changed_files }}"
              echo ""
            fi
            echo "Commit messages from source:"
            echo "${{ env.commit_messages }}"
            echo ""
            echo "A PR ID reference will be added below for future uat → prod promotions."
          } > pr_body.txt
          
          # Store body content for later use
          BODY_CONTENT=$(cat pr_body.txt)
          echo "body_content<<EOF" >> $GITHUB_ENV
          echo "$BODY_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Push branch
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          git push origin "HEAD:$BR"

      - name: Create PR
        id: create_pr
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          PR_TITLE="[${{ env.jira_id }}] Promote changes from dev to uat (PR #${{ steps.validate.outputs.pr_number }})"
          
          # Read the body content
          BODY_CONTENT=$(cat pr_body.txt)
          
          # Create JSON payload
          JSON_PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg head "$BR" \
            --arg base "uat" \
            --arg body "$BODY_CONTENT" \
            '{title: $title, head: $head, base: $base, body: $body}')
          
          RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls")
          
          PR_NUM=$(echo "$RESPONSE" | jq -r '.number')
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "Failed to create PR"
            exit 1
          fi
          
          echo "created_pr=$PR_NUM" >> $GITHUB_OUTPUT
          
          # Update PR with ID
          {
            echo "$BODY_CONTENT"
            echo ""
            echo "UAT PR ID: $PR_NUM"
            echo "Retain this ID for uat → prod promotions."
          } > updated_body.txt
          
          UPDATE_PAYLOAD=$(jq -n --arg body "$(cat updated_body.txt)" '{body: $body}')
          
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUM}" > /dev/null
          
          # Add labels
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"labels":["dev-to-uat","automated-promotion"]}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUM}/labels" > /dev/null

      - name: Completion
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          echo "Promotion Dev → UAT completed successfully."
          echo "UAT PR #${{ steps.create_pr.outputs.created_pr }} created"
