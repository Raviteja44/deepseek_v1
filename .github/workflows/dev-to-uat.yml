name: 2. Promote Dev → UAT

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into dev"
        required: true
        type: number
      source_branch:
        description: "Source branch: dev"
        required: true
        type: choice
        options:
          - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Git and tools
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR exists, is merged, and targeted dev
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"

          if [ -z "$PR" ]; then
            echo "Error: PR number cannot be empty." >&2
            exit 1
          fi

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          ERR=$(echo "$PR_JSON" | jq -r '.message // empty')
          if [ -n "$ERR" ]; then
            echo "Error: PR #$PR not found. API message: $ERR" >&2
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')

          if [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR is not merged." >&2
            exit 1
          fi

          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "Error: PR #$PR must have been merged into dev (found: $BASE_BRANCH)." >&2
            exit 1
          fi

          # Get merge commit SHA
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')
          
          if [ -z "$MERGE_COMMIT" ] || [ "$MERGE_COMMIT" = "null" ]; then
            echo "Error: Could not get merge commit SHA for PR #$PR"
            exit 1
          fi

          echo "pr_number=$PR" >> $GITHUB_OUTPUT
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT
          echo "PR Details:"
          echo "PR Number: $PR"
          echo "Base Branch: $BASE_BRANCH"
          echo "Merged: $MERGED"
          echo "Merge Commit SHA: $MERGE_COMMIT"

      - name: Extract Jira ID from PR metadata
        id: jira
        run: |
          PR="${{ steps.validate.outputs.pr_number }}"

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          echo "PR Title: $TITLE"
          echo "PR Body Preview: ${BODY:0:100}..."

          # Try multiple patterns to find JIRA ID
          JIRA_ID=$(echo "$TITLE" | grep -oE "\[JIRA-[0-9]+\]" | head -1 | tr -d '[]' || echo "")
          
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID=$(echo "$TITLE" | grep -oE "JIRA-[0-9]+" | head -1 || echo "")
          fi
          
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID=$(echo "$BODY" | grep -oE "JIRA-[0-9]+" | head -1 || echo "")
          fi
          
          if [ -z "$JIRA_ID" ]; then
            echo "Warning: No Jira ID found, using PR number as identifier"
            JIRA_ID="PR-$PR"
          fi

          echo "Jira ID: $JIRA_ID"
          echo "jira_id=$JIRA_ID" >> $GITHUB_ENV

      - name: Get changes from merge commit
        id: get-changes
        run: |
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          
          echo "Using merge commit SHA: $MERGE_COMMIT"
          
          # Get parent commit (dev before this PR was merged)
          PARENT_COMMITS=$(git log --pretty=%P -n 1 "$MERGE_COMMIT")
          
          if [ -z "$PARENT_COMMITS" ]; then
            echo "Error: Could not get parent commits for merge commit $MERGE_COMMIT"
            exit 1
          fi
          
          # For a merge commit, the first parent is the target branch (dev)
          PARENT_DEV=$(echo "$PARENT_COMMITS" | awk '{print $1}')
          
          if [ -z "$PARENT_DEV" ]; then
            echo "Error: Could not extract dev parent from merge commit"
            exit 1
          fi
          
          echo "Parent commit (dev before PR): $PARENT_DEV"
          
          # Get the second parent (feature branch tip)
          FEATURE_PARENT=$(echo "$PARENT_COMMITS" | awk '{print $2}')
          echo "Feature branch parent: $FEATURE_PARENT"
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only "$PARENT_DEV" "$MERGE_COMMIT")
          echo "changed_files<<EOF" >> $GITHUB_ENV
          echo "$CHANGED_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Get commit messages
          COMMIT_MESSAGES=$(git log --oneline "$PARENT_DEV".."$MERGE_COMMIT")
          echo "commit_messages<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Count commits (merge + feature commits)
          COMMIT_COUNT=$(git log --oneline "$PARENT_DEV".."$MERGE_COMMIT" | wc -l)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_ENV
          
          echo "parent_commit=$PARENT_DEV" >> $GITHUB_OUTPUT
          echo "feature_parent=$FEATURE_PARENT" >> $GITHUB_OUTPUT
          
          # Create a better patch file - get diff between dev parent and feature parent
          # This gets the actual changes from the feature branch
          git diff "$PARENT_DEV" "$FEATURE_PARENT" > changes.patch
          
          if [ ! -s changes.patch ]; then
            echo "Warning: Patch file is empty, trying alternative diff method"
            # Try diff between dev parent and merge commit
            git diff "$PARENT_DEV" "$MERGE_COMMIT" > changes.patch
          fi
          
          if [ ! -s changes.patch ]; then
            echo "Warning: Patch file is still empty, no changes to apply"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "has_changes=true" >> $GITHUB_ENV
            echo "Created patch file with $(wc -l < changes.patch) lines"
            echo "Patch file preview (first 10 lines):"
            head -10 changes.patch
          fi

      - name: Check if changes already in UAT
        run: |
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          
          git fetch origin uat
          
          if git merge-base --is-ancestor "$MERGE_COMMIT" origin/uat; then
            echo "Changes from PR already exist in UAT"
            echo "already_in_uat=true" >> $GITHUB_ENV
          else
            echo "already_in_uat=false" >> $GITHUB_ENV
          fi

      - name: Stop if already in UAT
        if: env.already_in_uat == 'true'
        run: |
          echo "Changes already promoted to UAT"
          exit 0

      - name: Stop if no changes
        if: env.has_changes == 'false'
        run: |
          echo "No changes found to promote"
          exit 0

      - name: Create temporary promote branch from uat
        id: create_branch
        run: |
          PR="${{ github.event.inputs.pr_number }}"
          JIRA_ID="${{ env.jira_id }}"
          TS=$(date +%s)
          BRANCH="promote/${JIRA_ID}-pr${PR}-${TS}"

          git fetch origin uat
          git checkout -b "$BRANCH" origin/uat

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Created branch: $BRANCH"

      - name: Apply changes using simpler method
        id: apply_changes
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          PR="${{ github.event.inputs.pr_number }}"
          PARENT_DEV="${{ steps.get-changes.outputs.parent_commit }}"
          FEATURE_PARENT="${{ steps.get-changes.outputs.feature_parent }}"
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          
          echo "Applying changes from PR #$PR"
          echo "Method 1: Using git checkout to get files from feature branch"
          
          # Method 1: Checkout files from feature branch
          if [ -n "$FEATURE_PARENT" ]; then
            echo "Checking out files from feature branch commit: $FEATURE_PARENT"
            
            # Get list of changed files
            FILES_TO_COPY=$(git diff --name-only "$PARENT_DEV" "$FEATURE_PARENT")
            
            if [ -n "$FILES_TO_COPY" ]; then
              echo "Files to copy:"
              echo "$FILES_TO_COPY"
              
              # Copy each file from feature branch
              for FILE in $FILES_TO_COPY; do
                echo "Copying: $FILE"
                git checkout "$FEATURE_PARENT" -- "$FILE" 2>/dev/null || echo "Could not checkout $FILE"
              done
              
              # Check if we have any changes
              if git status --porcelain | grep -q "."; then
                echo "✓ Successfully copied files from feature branch"
                
                # Add all changes
                git add -A
                
                # Create a commit with proper message
                COMMIT_MSG="Promote PR #$PR (${{ env.jira_id }}) to UAT
                
                Includes changes from PR #$PR merged into dev
                Merge commit: $MERGE_COMMIT
                Feature branch: $FEATURE_PARENT"
                
                echo "$COMMIT_MSG" | git commit -F -
                
                echo "changes_applied=true" >> $GITHUB_OUTPUT
                echo "method=checkout" >> $GITHUB_OUTPUT
              else
                echo "No changes were applied"
                echo "changes_applied=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "No files to copy"
              echo "changes_applied=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No feature parent found, trying alternative method"
            echo "changes_applied=false" >> $GITHUB_OUTPUT
          fi
          
          # Method 2: If first method failed, try using git format-patch
          if [ "${{ steps.apply_changes.outputs.changes_applied }}" != "true" ]; then
            echo "Method 2: Using git format-patch"
            
            # Create patches for individual commits
            git format-patch "$PARENT_DEV".."$MERGE_COMMIT" --stdout > commits.patch
            
            if [ -s commits.patch ]; then
              echo "Applying patches..."
              if git am --whitespace=nowarn < commits.patch; then
                echo "✓ Successfully applied patches"
                
                # Update commit message to be more descriptive
                git commit --amend -m "Promote PR #$PR (${{ env.jira_id }}) to UAT" -m "Includes changes from PR #$PR merged into dev" -m "Merge commit: $MERGE_COMMIT"
                
                echo "changes_applied=true" >> $GITHUB_OUTPUT
                echo "method=format-patch" >> $GITHUB_OUTPUT
              else
                echo "✗ Failed to apply patches with git am"
                echo "changes_applied=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "No patches generated"
              echo "changes_applied=false" >> $GITHUB_OUTPUT
            fi
          fi
          
          # Method 3: If still failed, use simple cherry-pick of feature commits
          if [ "${{ steps.apply_changes.outputs.changes_applied }}" != "true" ]; then
            echo "Method 3: Cherry-picking feature commits individually"
            
            # Get commits from feature branch (excluding merge commit)
            FEATURE_COMMITS=$(git log --no-merges --pretty=format:"%H" "$PARENT_DEV".."$MERGE_COMMIT")
            
            if [ -n "$FEATURE_COMMITS" ]; then
              echo "Found feature commits to cherry-pick:"
              echo "$FEATURE_COMMITS"
              
              SUCCESS=true
              for COMMIT in $FEATURE_COMMITS; do
                echo "Cherry-picking: $(git log --oneline -n 1 $COMMIT)"
                if ! git cherry-pick -x "$COMMIT"; then
                  echo "Failed to cherry-pick $COMMIT"
                  git cherry-pick --abort
                  SUCCESS=false
                  break
                fi
              done
              
              if [ "$SUCCESS" = "true" ]; then
                echo "✓ Successfully cherry-picked all feature commits"
                echo "changes_applied=true" >> $GITHUB_OUTPUT
                echo "method=cherry-pick" >> $GITHUB_OUTPUT
              else
                echo "✗ Failed to cherry-pick feature commits"
                echo "changes_applied=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "No feature commits found"
              echo "changes_applied=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Push changes if applied successfully
        if: steps.apply_changes.outputs.changes_applied == 'true'
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          
          echo "Pushing branch $BR to remote"
          git push origin "HEAD:$BR"
          echo "✓ Successfully pushed branch"

      - name: Build PR body content
        id: body
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          PR="${{ github.event.inputs.pr_number }}"
          JIRA_ID="${{ env.jira_id }}"
          
          # Get changed files
          FILES="${{ env.changed_files }}"
          FILE_COUNT=$(echo "$FILES" | sed '/^\s*$/d' | wc -l | tr -d ' ')
          
          METHOD="${{ steps.apply_changes.outputs.method }}"
          
          echo "Automated Promotion PR" > body.txt
          echo "" >> body.txt
          echo "Jira ID: ${JIRA_ID}" >> body.txt
          echo "Source PR: #$PR (merged into dev)" >> body.txt
          echo "Dev Merge Commit: ${{ steps.validate.outputs.merge_commit }}" >> body.txt
          echo "Target branch: uat" >> body.txt
          echo "Application method: $METHOD" >> body.txt
          echo "" >> body.txt
          echo "Changes identified: $FILE_COUNT files" >> body.txt
          echo "" >> body.txt
          
          if [ -n "$FILES" ]; then
            echo "Changed files:" >> body.txt
            echo "$FILES" >> body.txt
            echo "" >> body.txt
          fi
          
          echo "Commit messages from source:" >> body.txt
          echo "${{ env.commit_messages }}" >> body.txt
          echo "" >> body.txt
          echo "A PR ID reference will be added below for future uat → prod promotions." >> body.txt

      - name: Create PR into uat
        id: create_pr
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          JIRA_ID="${{ env.jira_id }}"
          TITLE="[${JIRA_ID}] Promote changes from dev to uat (PR #${{ github.event.inputs.pr_number }})"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg head "$BR" \
            --arg base "uat" \
            --arg body "$(cat body.txt)" \
            '{title:$title, head:$head, base:$base, body:$body}')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls")

          echo "$RESPONSE" > created.json

          PR_NUM=$(jq -r '.number' created.json)
          if [ "$PR_NUM" = "null" ]; then
            echo "Error creating PR: $(jq -r '.message' created.json)" >&2
            exit 1
          fi

          echo "created_pr=$PR_NUM" >> $GITHUB_OUTPUT
          echo "Created PR #$PR_NUM"

      - name: Update PR body with PR ID
        run: |
          PR="${{ steps.create_pr.outputs.created_pr }}"
          UPDATED=updated_body.txt

          cat body.txt > "$UPDATED"
          echo "" >> "$UPDATED"
          echo "UAT PR ID: $PR" >> "$UPDATED"
          echo "Retain this ID for uat → prod promotions." >> "$UPDATED"

          PAYLOAD=$(jq -n --arg body "$(cat $UPDATED)" '{body:$body}')

          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}" > /dev/null

      - name: Apply Jira and environment labels
        run: |
          PR="${{ steps.create_pr.outputs.created_pr }}"
          JIRA_ID="${{ env.jira_id }}"

          LABELS=$(jq -n --arg jira "$JIRA_ID" '{labels: [$jira, "dev-to-uat", "automated-promotion"]}')

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$LABELS" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR}/labels"

      - name: Completed
        run: |
          echo "Promotion Dev → UAT completed successfully."
          echo "UAT PR #${{ steps.create_pr.outputs.created_pr }} created"
