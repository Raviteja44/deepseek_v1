name: 3. Promote Dev → UAT

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into dev"
        required: true
        type: number
      source_branch:
        description: "Source branch: dev"
        required: true
        type: choice
        options:
          - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Git and tools
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR exists, is merged, and targeted dev
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"

          if [ -z "$PR" ]; then
            echo "Error: PR number cannot be empty." >&2
            exit 1
          fi

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          ERR=$(echo "$PR_JSON" | jq -r '.message // empty')
          if [ -n "$ERR" ]; then
            echo "Error: PR #$PR not found. API message: $ERR" >&2
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')

          if [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR is not merged." >&2
            exit 1
          fi

          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "Error: PR #$PR must have been merged into dev (found: $BASE_BRANCH)." >&2
            exit 1
          fi

          # Get merge commit SHA using the merge_sha field from the PR response
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')
          
          if [ -z "$MERGE_COMMIT" ] || [ "$MERGE_COMMIT" = "null" ]; then
            echo "Error: Could not get merge commit SHA for PR #$PR"
            echo "Trying alternative method..."
            
            # Alternative: Get the latest commit and check if it's a merge commit
            LATEST_COMMIT=$(curl -s \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}/commits" \
              | jq -r '.[-1].sha')
            
            if [ -z "$LATEST_COMMIT" ] || [ "$LATEST_COMMIT" = "null" ]; then
              echo "Error: Could not get any commit SHA for PR #$PR"
              exit 1
            fi
            
            MERGE_COMMIT="$LATEST_COMMIT"
          fi

          echo "pr_number=$PR" >> $GITHUB_OUTPUT
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT
          echo "PR Details:"
          echo "PR Number: $PR"
          echo "Base Branch: $BASE_BRANCH"
          echo "Merged: $MERGED"
          echo "Merge Commit SHA: $MERGE_COMMIT"

      - name: Extract Jira ID from PR metadata
        id: jira
        run: |
          PR="${{ steps.validate.outputs.pr_number }}"

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          echo "PR Title: $TITLE"
          echo "PR Body Preview: ${BODY:0:100}..."

          # Try multiple patterns to find JIRA ID
          JIRA_ID=$(echo "$TITLE" | grep -oE "\[JIRA-[0-9]+\]" | head -1 | tr -d '[]' || echo "")
          
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID=$(echo "$TITLE" | grep -oE "JIRA-[0-9]+" | head -1 || echo "")
          fi
          
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID=$(echo "$BODY" | grep -oE "JIRA-[0-9]+" | head -1 || echo "")
          fi
          
          if [ -z "$JIRA_ID" ]; then
            echo "Warning: No Jira ID found, using PR number as identifier"
            JIRA_ID="PR-$PR"
          fi

          echo "Jira ID: $JIRA_ID"
          echo "jira_id=$JIRA_ID" >> $GITHUB_ENV

      - name: Get exact PR changes using merge commit
        id: get-changes
        run: |
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          
          echo "Using merge commit SHA: $MERGE_COMMIT"
          
          # First, let's verify we can see this commit
          git show --oneline "$MERGE_COMMIT" || echo "Cannot show commit directly, will try git log"
          
          # Get parent commits
          echo "Getting parent commits for merge commit..."
          PARENT_COMMITS=$(git log --pretty=%P -n 1 "$MERGE_COMMIT" 2>/dev/null)
          
          if [ -z "$PARENT_COMMITS" ]; then
            echo "Warning: Could not get parent commits directly, trying alternative..."
            # Try to get commit info from git show
            COMMIT_INFO=$(git show --quiet --pretty="%P" "$MERGE_COMMIT" 2>/dev/null)
            if [ -n "$COMMIT_INFO" ]; then
              PARENT_COMMITS="$COMMIT_INFO"
            else
              echo "Error: Cannot get parent commits for $MERGE_COMMIT"
              echo "Available recent commits:"
              git log --oneline -10
              exit 1
            fi
          fi
          
          echo "Parent commits string: $PARENT_COMMITS"
          
          # For a merge commit, the first parent is usually the target branch (dev)
          PARENT_DEV=$(echo "$PARENT_COMMITS" | awk '{print $1}')
          
          if [ -z "$PARENT_DEV" ]; then
            echo "Error: Could not extract dev parent from merge commit"
            echo "Parent commits: $PARENT_COMMITS"
            exit 1
          fi
          
          echo "Parent commit (dev before PR): $PARENT_DEV"
          
          # Verify the range
          echo "Checking commits between $PARENT_DEV and $MERGE_COMMIT..."
          COMMITS=$(git log --no-merges --pretty=format:"%H" "$PARENT_DEV".."$MERGE_COMMIT" 2>/dev/null)
          
          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits found in this PR range"
            echo "Checking if this might be a squash merge..."
            
            # For squash merges, get the actual commit message
            MERGE_MESSAGE=$(git log --format="%B" -n 1 "$MERGE_COMMIT")
            echo "Merge commit message:"
            echo "$MERGE_MESSAGE"
            
            # If squash merge, we might need to handle differently
            # For now, we'll treat the merge commit itself as the change
            echo "commits_found=false" >> $GITHUB_ENV
            echo "Warning: No individual commits found - might be a squash merge"
            
            # Get changed files from merge commit
            CHANGED_FILES=$(git diff --name-only "$PARENT_DEV" "$MERGE_COMMIT")
            echo "changed_files<<EOF" >> $GITHUB_ENV
            echo "$CHANGED_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            # Get commit message
            COMMIT_MESSAGE=$(git log --oneline -n 1 "$MERGE_COMMIT")
            echo "commit_messages<<EOF" >> $GITHUB_ENV
            echo "$COMMIT_MESSAGE" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
          else
            COMMIT_COUNT=$(echo "$COMMITS" | wc -l)
            echo "Found $COMMIT_COUNT commits to promote"
            echo "commits_found=true" >> $GITHUB_ENV
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_ENV
            
            # Store commits for cherry-picking
            echo "commits_list<<EOF" >> $GITHUB_ENV
            echo "$COMMITS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            # Get changed files for PR description
            CHANGED_FILES=$(git diff --name-only "$PARENT_DEV".."$MERGE_COMMIT")
            echo "changed_files<<EOF" >> $GITHUB_ENV
            echo "$CHANGED_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            # Get commit messages for PR description
            COMMIT_MESSAGES=$(git log --oneline "$PARENT_DEV".."$MERGE_COMMIT")
            echo "commit_messages<<EOF" >> $GITHUB_ENV
            echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          
          echo "parent_commit=$PARENT_DEV" >> $GITHUB_OUTPUT

      - name: Check if changes already in UAT
        run: |
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          
          git fetch origin uat
          
          if git merge-base --is-ancestor "$MERGE_COMMIT" origin/uat 2>/dev/null; then
            echo "Changes from PR already exist in UAT"
            echo "already_in_uat=true" >> $GITHUB_ENV
          else
            echo "already_in_uat=false" >> $GITHUB_ENV
          fi

      - name: Stop if already in UAT
        if: env.already_in_uat == 'true'
        run: |
          echo "Changes already promoted to UAT"
          exit 0

      - name: Create temporary promote branch from uat
        if: env.commits_found == 'true'
        id: create_branch
        run: |
          PR="${{ github.event.inputs.pr_number }}"
          JIRA_ID="${{ env.jira_id }}"
          TS=$(date +%s)
          BRANCH="promote/${JIRA_ID}-pr${PR}-${TS}"

          git fetch origin uat
          git checkout -b "$BRANCH" origin/uat

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Created branch: $BRANCH"

      - name: Cherry-pick commits onto UAT branch
        if: env.commits_found == 'true'
        id: cherry_pick
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          PR="${{ github.event.inputs.pr_number }}"
          
          echo "Cherry-picking ${{ env.commit_count }} commits from PR #$PR"
          
          IFS=$'\n' read -r -d '' -a COMMITS_ARRAY <<< "${{ env.commits_list }}"
          SUCCESS_COUNT=0
          
          for COMMIT in "${COMMITS_ARRAY[@]}"; do
            if [ -n "$COMMIT" ]; then
              COMMIT_MSG=$(git log --format="%s" -n 1 "$COMMIT")
              echo "Cherry-picking: $COMMIT_MSG ($(echo $COMMIT | cut -c1-7))"
              if git cherry-pick -x "$COMMIT"; then
                ((SUCCESS_COUNT++))
                echo "✓ Success"
              else
                echo "✗ Failed to cherry-pick commit: $COMMIT"
                echo "Attempting conflict resolution..."
                
                # Check for conflicts
                if git status | grep -q "both modified"; then
                  echo "Conflict detected. Aborting cherry-pick."
                  git cherry-pick --abort
                  exit 1
                else
                  # Unknown error, try to continue
                  git cherry-pick --continue || git cherry-pick --abort
                  exit 1
                fi
              fi
            fi
          done
          
          echo "Successfully cherry-picked $SUCCESS_COUNT commits"
          echo "cherry_picked_count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
          
          # Push the branch
          git push origin "HEAD:$BR"
          echo "Pushed branch $BR to remote"

      - name: Handle squash merge (if no individual commits)
        if: env.commits_found == 'false'
        id: squash_merge
        run: |
          echo "Handling as squash merge or single commit..."
          
          PR="${{ github.event.inputs.pr_number }}"
          JIRA_ID="${{ env.jira_id }}"
          TS=$(date +%s)
          BRANCH="promote/${JIRA_ID}-pr${PR}-squash-${TS}"
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          PARENT_DEV="${{ steps.get-changes.outputs.parent_commit }}"
          
          # Create branch from uat
          git fetch origin uat
          git checkout -b "$BRANCH" origin/uat
          
          # Apply changes from merge commit
          echo "Applying changes from merge commit $MERGE_COMMIT"
          git cherry-pick -n "$MERGE_COMMIT"
          
          # Commit with appropriate message
          COMMIT_MSG="Promote PR #$PR ($JIRA_ID) to UAT - squash merge"
          git commit -m "$COMMIT_MSG"
          
          # Push the branch
          git push origin "HEAD:$BRANCH"
          
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "cherry_picked_count=1" >> $GITHUB_OUTPUT

      - name: Build PR body content
        id: body
        run: |
          if [ "${{ env.commits_found }}" = "true" ]; then
            BR="${{ steps.create_branch.outputs.branch }}"
            PR="${{ github.event.inputs.pr_number }}"
            JIRA_ID="${{ env.jira_id }}"
            
            # Get changed files from our cherry-picked branch
            FILES=$(git --no-pager diff --name-only origin/uat..origin/"$BR" 2>/dev/null || echo "Could not get file list")
            FILE_COUNT=$(echo "$FILES" | sed '/^\s*$/d' | wc -l | tr -d ' ')
            
            # Get commit messages from our stored list
            COMMITS_INFO=""
            IFS=$'\n' read -r -d '' -a COMMITS_ARRAY <<< "${{ env.commits_list }}"
            for COMMIT in "${COMMITS_ARRAY[@]}"; do
              if [ -n "$COMMIT" ]; then
                MSG=$(git log --format="%s" -n 1 "$COMMIT" 2>/dev/null || echo "Unknown commit")
                COMMITS_INFO="${COMMITS_INFO}- $MSG ($(echo $COMMIT | cut -c1-7))"$'\n'
              fi
            done

            echo "Automated Promotion PR (Merge Commit Strategy)" > body.txt
            echo "" >> body.txt
            echo "Jira ID: ${JIRA_ID}" >> body.txt
            echo "Source PR: #$PR (merged into dev)" >> body.txt
            echo "Dev Merge Commit: ${{ steps.validate.outputs.merge_commit }}" >> body.txt
            echo "Target branch: uat" >> body.txt
            echo "" >> body.txt
            echo "Changes identified: $FILE_COUNT files, ${{ env.commit_count }} commits" >> body.txt
            echo "Successfully cherry-picked: ${{ steps.cherry_pick.outputs.cherry_picked_count }} commits" >> body.txt
            echo "" >> body.txt
            echo "Changed files:" >> body.txt
            echo "$FILES" >> body.txt
            echo "" >> body.txt
            echo "Commit messages (from source PR):" >> body.txt
            echo "$COMMITS_INFO" >> body.txt
            echo "" >> body.txt
            echo "Traceability: All commits have '(cherry picked from commit ...)' annotation" >> body.txt
          else
            # For squash merge
            BR="${{ steps.squash_merge.outputs.branch }}"
            PR="${{ github.event.inputs.pr_number }}"
            JIRA_ID="${{ env.jira_id }}"
            
            FILES="${{ env.changed_files }}"
            FILE_COUNT=$(echo "$FILES" | sed '/^\s*$/d' | wc -l | tr -d ' ')
            
            echo "Automated Promotion PR (Squash Merge)" > body.txt
            echo "" >> body.txt
            echo "Jira ID: ${JIRA_ID}" >> body.txt
            echo "Source PR: #$PR (merged into dev)" >> body.txt
            echo "Dev Merge Commit: ${{ steps.validate.outputs.merge_commit }}" >> body.txt
            echo "Target branch: uat" >> body.txt
            echo "" >> body.txt
            echo "Changes identified: $FILE_COUNT files" >> body.txt
            echo "Merge type: Squash merge (single commit)" >> body.txt
            echo "" >> body.txt
            echo "Changed files:" >> body.txt
            echo "$FILES" >> body.txt
            echo "" >> body.txt
            echo "Merge commit message:" >> body.txt
            echo "${{ env.commit_messages }}" >> body.txt
          fi
          
          echo "" >> body.txt
          echo "A PR ID reference will be added below for future uat → prod promotions." >> body.txt

      - name: Create PR into uat
        id: create_pr
        run: |
          if [ "${{ env.commits_found }}" = "true" ]; then
            BR="${{ steps.create_branch.outputs.branch }}"
          else
            BR="${{ steps.squash_merge.outputs.branch }}"
          fi
          
          JIRA_ID="${{ env.jira_id }}"
          TITLE="[${JIRA_ID}] Promote changes from dev to uat (PR #${{ github.event.inputs.pr_number }})"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg head "$BR" \
            --arg base "uat" \
            --arg body "$(cat body.txt)" \
            '{title:$title, head:$head, base:$base, body:$body}')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls")

          echo "$RESPONSE" > created.json

          PR_NUM=$(jq -r '.number' created.json)
          if [ "$PR_NUM" = "null" ]; then
            echo "Error creating PR: $(jq -r '.message' created.json)" >&2
            exit 1
          fi

          echo "created_pr=$PR_NUM" >> $GITHUB_OUTPUT
          echo "Created PR #$PR_NUM"

      - name: Update PR body with PR ID
        run: |
          PR="${{ steps.create_pr.outputs.created_pr }}"
          UPDATED=updated_body.txt

          cat body.txt > "$UPDATED"
          echo "" >> "$UPDATED"
          echo "UAT PR ID: $PR" >> "$UPDATED"
          echo "Retain this ID for uat → prod promotions." >> "$UPDATED"

          PAYLOAD=$(jq -n --arg body "$(cat $UPDATED)" '{body:$body}')

          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}" > /dev/null

      - name: Apply Jira and environment labels
        run: |
          PR="${{ steps.create_pr.outputs.created_pr }}"
          JIRA_ID="${{ env.jira_id }}"

          LABELS=$(jq -n --arg jira "$JIRA_ID" '{labels: [$jira, "dev-to-uat", "automated-promotion"]}')

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$LABELS" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR}/labels"

      - name: Completed
        run: |
          echo "Promotion Dev → UAT completed successfully."
          echo "UAT PR #${{ steps.create_pr.outputs.created_pr }} created"
