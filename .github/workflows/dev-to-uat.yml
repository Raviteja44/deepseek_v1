name: 2. Promote Dev to UAT

on:
  workflow_dispatch:
    inputs:
      dev_pr_number:
        description: "PR number that was merged into dev"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    environment: uat
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR details and validate
        id: get-pr-info
        run: |
          PR_NUMBER="${{ github.event.inputs.dev_pr_number }}"
          
          PR_JSON=$(gh pr view "$PR_NUMBER" --json state,merged,baseRefName,mergeCommit,title,body,headRefName,url)
          
          STATE=$(echo "$PR_JSON" | jq -r '.state')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')
          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.baseRefName')
          MERGE_COMMIT=$(echo "$PR_JSON" | jq -r '.mergeCommit.oid')
          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          SOURCE_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
          
          if [ "$STATE" != "MERGED" ] || [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR_NUMBER is not merged"
            exit 1
          fi
          
          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "Error: PR #$PR_NUMBER was not merged into dev"
            exit 1
          fi
          
          if [ "$MERGE_COMMIT" = "null" ] || [ -z "$MERGE_COMMIT" ]; then
            echo "Error: Could not find merge commit for PR #$PR_NUMBER"
            exit 1
          fi
          
          JIRA_ID=$(echo "$TITLE" | grep -oE "\[JIRA-[0-9]+\]" | head -1 | tr -d '[]' || echo "")
          if [ -z "$JIRA_ID" ]; then
            JIRA_ID=$(echo "$TITLE" | grep -oE "JIRA-[0-9]+" | head -1 || echo "PR-$PR_NUMBER")
          fi
          
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT
          echo "jira_id=$JIRA_ID" >> $GITHUB_OUTPUT
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT

      - name: Find exact changes for this PR only
        id: find-changes
        run: |
          MERGE_COMMIT="${{ steps.get-pr-info.outputs.merge_commit }}"
          
          PARENT_DEV=$(git log --pretty=%P -n 1 "$MERGE_COMMIT" | cut -d' ' -f1)
          
          if [ -z "$PARENT_DEV" ]; then
            echo "Could not find parent commit for merge commit $MERGE_COMMIT"
            exit 1
          fi
          
          COMMITS=$(git log --no-merges --pretty=format:"%H" "$PARENT_DEV".."$MERGE_COMMIT")
          
          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits found in this PR range"
            echo "commits_found=false" >> $GITHUB_ENV
          else
            COMMIT_COUNT=$(echo "$COMMITS" | wc -l)
            echo "commits_found=true" >> $GITHUB_ENV
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_ENV
            
            echo "commits_list=$COMMITS" >> $GITHUB_ENV
            
            CHANGED_FILES=$(git diff --name-only "$PARENT_DEV".."$MERGE_COMMIT")
            echo "changed_files<<EOF" >> $GITHUB_ENV
            echo "$CHANGED_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            COMMIT_MESSAGES=$(git log --oneline "$PARENT_DEV".."$MERGE_COMMIT")
            echo "commit_messages<<EOF" >> $GITHUB_ENV
            echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          
          echo "parent_commit=$PARENT_DEV" >> $GITHUB_OUTPUT

      - name: Check if changes already in UAT
        run: |
          MERGE_COMMIT="${{ steps.get-pr-info.outputs.merge_commit }}"
          
          git fetch origin uat
          
          if git merge-base --is-ancestor "$MERGE_COMMIT" origin/uat; then
            echo "Changes from PR already exist in UAT"
            echo "already_in_uat=true" >> $GITHUB_ENV
          else
            echo "already_in_uat=false" >> $GITHUB_ENV
          fi

      - name: Stop if no changes or already in UAT
        if: env.commits_found == 'false' || env.already_in_uat == 'true'
        run: |
          if [ "${{ env.commits_found }}" = "false" ]; then
            echo "No commits found to promote"
          fi
          if [ "${{ env.already_in_uat }}" = "true" ]; then
            echo "Changes already promoted to UAT"
          fi
          exit 0

      - name: Create promotion branch from UAT
        id: create-branch
        run: |
          PR_NUMBER="${{ github.event.inputs.dev_pr_number }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="promote/uat-pr$PR_NUMBER-$TIMESTAMP"
          
          git checkout -b "$BRANCH_NAME" origin/uat
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Cherry-pick PR changes onto UAT
        run: |
          IFS=$'\n' read -r -d '' -a COMMITS_ARRAY <<< "${{ env.commits_list }}"
          
          for COMMIT in "${COMMITS_ARRAY[@]}"; do
            if [ -n "$COMMIT" ]; then
              if ! git cherry-pick -x "$COMMIT"; then
                echo "Failed to cherry-pick commit: $COMMIT"
                git cherry-pick --abort
                exit 1
              fi
            fi
          done
          
          git push origin "${{ steps.create-branch.outputs.branch_name }}"

      - name: Create UAT promotion PR
        id: create-uat-pr
        run: |
          PR_NUMBER="${{ github.event.inputs.dev_pr_number }}"
          JIRA_ID="${{ steps.get-pr-info.outputs.jira_id }}"
          SOURCE_BRANCH="${{ steps.get-pr-info.outputs.source_branch }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"
          MERGE_COMMIT="${{ steps.get-pr-info.outputs.merge_commit }}"
          
          PR_TITLE="[$JIRA_ID] Promote changes from dev to uat"
          
          PR_BODY="## UAT Promotion Request
          
          Source PR: #$PR_NUMBER
          JIRA ID: $JIRA_ID
          Source Branch: $SOURCE_BRANCH
          Merge Commit: $MERGE_COMMIT
          Target Branch: uat
          Changes Promoted: ${{ env.commit_count }} commits
          
          Changed Files:
          \`\`\`
          ${{ env.changed_files }}
          \`\`\`
          
          Commit Messages:
          \`\`\`
          ${{ env.commit_messages }}
          \`\`\`
          
          Traceability:
          - Feature Branch: $SOURCE_BRANCH
          - Dev PR: #$PR_NUMBER
          - Dev Merge Commit: $MERGE_COMMIT
          - UAT Promotion PR: #[NEXT]
          
          Validation:
          - PR #$PR_NUMBER merged to dev
          - Changes isolated to this PR only
          - Cherry-picked with -x flag for traceability
          
          Important Notes:
          1. UAT PR ID: #[NEXT]
          2. All commits have (cherry picked from commit ...) annotation
          3. Only changes from PR #$PR_NUMBER are included
          
          Automatically generated by GitHub Actions"
          
          PR_RESULT=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base uat \
            --head "$BRANCH_NAME" \
            --label "dev-to-uat" \
            --label "$JIRA_ID" \
            --output json)
          
          UAT_PR_NUMBER=$(echo "$PR_RESULT" | jq -r '.number')
          UAT_PR_URL=$(echo "$PR_RESULT" | jq -r '.url')
          
          echo "uat_pr_number=$UAT_PR_NUMBER" >> $GITHUB_OUTPUT
          echo "uat_pr_url=$UAT_PR_URL" >> $GITHUB_OUTPUT

      - name: Update UAT PR body with actual PR ID
        run: |
          UAT_PR_NUMBER="${{ steps.create-uat-pr.outputs.uat_pr_number }}"
          
          CURRENT_BODY=$(gh pr view "$UAT_PR_NUMBER" --json body --jq '.body')
          UPDATED_BODY=$(echo "$CURRENT_BODY" | sed "s/#\[NEXT\]/#$UAT_PR_NUMBER/g")
          
          gh pr edit "$UAT_PR_NUMBER" --body "$UPDATED_BODY"