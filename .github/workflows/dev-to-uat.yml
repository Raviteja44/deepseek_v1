name: 2. Promote Dev → UAT

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into dev"
        required: true
        type: number
      source_branch:
        description: "Source branch: dev"
        required: true
        type: choice
        options:
          - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Git and tools
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR exists, is merged, and targeted dev
        id: validate
        run: |
          PR="${{ github.event.inputs.pr_number }}"

          if [ -z "$PR" ]; then
            echo "Error: PR number cannot be empty." >&2
            exit 1
          fi

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          ERR=$(echo "$PR_JSON" | jq -r '.message // empty')
          if [ -n "$ERR" ]; then
            echo "Error: PR #$PR not found. API message: $ERR" >&2
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
          MERGED=$(echo "$PR_JSON" | jq -r '.merged')

          if [ "$MERGED" != "true" ]; then
            echo "Error: PR #$PR is not merged." >&2
            exit 1
          fi

          if [ "$BASE_BRANCH" != "dev" ]; then
            echo "Error: PR #$PR must have been merged into dev (found: $BASE_BRANCH)." >&2
            exit 1
          fi

          # Get merge commit SHA (more reliable than last commit)
          MERGE_COMMIT=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}/merge" \
            | jq -r '.sha // .message')
          
          if [ -z "$MERGE_COMMIT" ] || [[ "$MERGE_COMMIT" == *"Not*"* ]] || [[ "$MERGE_COMMIT" == *"not*"* ]]; then
            echo "Error: Could not get merge commit for PR #$PR"
            echo "Merge commit response: $MERGE_COMMIT"
            exit 1
          fi

          echo "pr_number=$PR" >> $GITHUB_OUTPUT
          echo "merge_commit=$MERGE_COMMIT" >> $GITHUB_OUTPUT

      - name: Extract Jira ID from PR metadata
        id: jira
        run: |
          PR="${{ steps.validate.outputs.pr_number }}"

          PR_JSON=$(curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}")

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          JIRA_ID=$(printf "%s\n%s" "$TITLE" "$BODY" | grep -oE "JIRA-[0-9]+" | head -n 1)

          if [ -z "$JIRA_ID" ]; then
            echo "Error: No Jira ID (JIRA-123 format) found in PR title or body." >&2
            exit 1
          fi

          echo "jira_id=$JIRA_ID" >> $GITHUB_ENV

      # ===== REPLACED: Download PR diff =====
      # ===== WITH: Get exact changes using merge commit strategy =====
      - name: Get exact PR changes using merge commit
        id: get-changes
        run: |
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          
          echo "Using merge commit: $MERGE_COMMIT"
          
          # Get parent commit (dev before this PR was merged)
          PARENT_COMMITS=$(git log --pretty=%P -n 1 "$MERGE_COMMIT")
          
          if [ -z "$PARENT_COMMITS" ]; then
            echo "Error: Could not find parent commits for merge commit $MERGE_COMMIT"
            exit 1
          fi
          
          # For a merge commit, the first parent is usually the target branch (dev)
          # and the second parent is the feature branch
          PARENT_DEV=$(echo "$PARENT_COMMITS" | cut -d' ' -f1)
          
          if [ -z "$PARENT_DEV" ]; then
            echo "Error: Could not extract dev parent from merge commit"
            exit 1
          fi
          
          echo "Parent commit (dev before PR): $PARENT_DEV"
          
          # Get all non-merge commits between parent and merge commit
          COMMITS=$(git log --no-merges --pretty=format:"%H" "$PARENT_DEV".."$MERGE_COMMIT")
          
          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits found in this PR range"
            echo "commits_found=false" >> $GITHUB_ENV
            exit 0
          else
            COMMIT_COUNT=$(echo "$COMMITS" | wc -l)
            echo "Found $COMMIT_COUNT commits to promote"
            echo "commits_found=true" >> $GITHUB_ENV
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_ENV
            
            # Store commits for cherry-picking
            echo "commits_list<<EOF" >> $GITHUB_ENV
            echo "$COMMITS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            # Get changed files for PR description
            CHANGED_FILES=$(git diff --name-only "$PARENT_DEV".."$MERGE_COMMIT")
            echo "changed_files<<EOF" >> $GITHUB_ENV
            echo "$CHANGED_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            
            # Get commit messages for PR description
            COMMIT_MESSAGES=$(git log --oneline "$PARENT_DEV".."$MERGE_COMMIT")
            echo "commit_messages<<EOF" >> $GITHUB_ENV
            echo "$COMMIT_MESSAGES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
          
          echo "parent_commit=$PARENT_DEV" >> $GITHUB_OUTPUT

      - name: Check if changes already in UAT
        run: |
          MERGE_COMMIT="${{ steps.validate.outputs.merge_commit }}"
          
          git fetch origin uat
          
          if git merge-base --is-ancestor "$MERGE_COMMIT" origin/uat; then
            echo "Changes from PR already exist in UAT"
            echo "already_in_uat=true" >> $GITHUB_ENV
          else
            echo "already_in_uat=false" >> $GITHUB_ENV
          fi

      - name: Stop if already in UAT
        if: env.already_in_uat == 'true'
        run: |
          echo "Changes already promoted to UAT"
          exit 0

      - name: Stop if no commits found
        if: env.commits_found == 'false'
        run: |
          echo "No commits found to promote"
          exit 0

      - name: Create temporary promote branch from uat
        id: create_branch
        run: |
          PR="${{ github.event.inputs.pr_number }}"
          JIRA_ID="${{ env.jira_id }}"
          TS=$(date +%s)
          BRANCH="promote/${JIRA_ID}-pr${PR}-${TS}"

          git fetch origin uat:refs/remotes/origin/uat || true
          git checkout -b "$BRANCH" origin/uat

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # ===== REPLACED: Apply PR diff and push temp branch =====
      # ===== WITH: Cherry-pick commits and push temp branch =====
      - name: Cherry-pick commits onto UAT branch
        id: cherry_pick
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          PR="${{ github.event.inputs.pr_number }}"
          
          echo "Cherry-picking ${{ env.commit_count }} commits from PR #$PR"
          
          IFS=$'\n' read -r -d '' -a COMMITS_ARRAY <<< "${{ env.commits_list }}"
          SUCCESS_COUNT=0
          
          for COMMIT in "${COMMITS_ARRAY[@]}"; do
            if [ -n "$COMMIT" ]; then
              echo "Cherry-picking: $(git log --oneline -n 1 $COMMIT)"
              if git cherry-pick -x "$COMMIT"; then
                ((SUCCESS_COUNT++))
              else
                echo "Failed to cherry-pick commit: $COMMIT"
                echo "Attempting conflict resolution..."
                
                # Check for conflicts
                if [ -f ".git/MERGE_MSG" ]; then
                  echo "Conflict detected. Aborting cherry-pick."
                  git cherry-pick --abort
                  exit 1
                else
                  # Unknown error
                  exit 1
                fi
              fi
            fi
          done
          
          echo "Successfully cherry-picked $SUCCESS_COUNT commits"
          echo "cherry_picked_count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
          
          # Commit with appropriate message
          git commit --allow-empty -m "Promote PR #$PR (${{ env.jira_id }}) to UAT - $SUCCESS_COUNT commits cherry-picked"
          
          # Push the branch
          git push origin "HEAD:$BR"

      - name: Build PR body content
        id: body
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          PR="${{ github.event.inputs.pr_number }}"
          JIRA_ID="${{ env.jira_id }}"
          
          # Get changed files from our cherry-picked branch
          FILES=$(git --no-pager diff --name-only origin/uat..origin/"$BR")
          FILE_COUNT=$(echo "$FILES" | sed '/^\s*$/d' | wc -l | tr -d ' ')
          
          # Get commit messages from our stored list
          COMMITS_INFO=""
          IFS=$'\n' read -r -d '' -a COMMITS_ARRAY <<< "${{ env.commits_list }}"
          for COMMIT in "${COMMITS_ARRAY[@]}"; do
            if [ -n "$COMMIT" ]; then
              MSG=$(git log --format="%s" -n 1 "$COMMIT")
              COMMITS_INFO="${COMMITS_INFO}- $MSG ($(echo $COMMIT | cut -c1-7))"$'\n'
            fi
          done

          echo "Automated Promotion PR (Merge Commit Strategy)" > body.txt
          echo "" >> body.txt
          echo "Jira ID: ${JIRA_ID}" >> body.txt
          echo "Source PR: #$PR (merged into dev)" >> body.txt
          echo "Dev Merge Commit: ${{ steps.validate.outputs.merge_commit }}" >> body.txt
          echo "Target branch: uat" >> body.txt
          echo "" >> body.txt
          echo "Changes identified: $FILE_COUNT files, ${{ env.commit_count }} commits" >> body.txt
          echo "Successfully cherry-picked: ${{ steps.cherry_pick.outputs.cherry_picked_count }} commits" >> body.txt
          echo "" >> body.txt
          echo "Changed files:" >> body.txt
          echo "$FILES" >> body.txt
          echo "" >> body.txt
          echo "Commit messages (from source PR):" >> body.txt
          echo "$COMMITS_INFO" >> body.txt
          echo "" >> body.txt
          echo "Traceability: All commits have '(cherry picked from commit ...)' annotation" >> body.txt
          echo "" >> body.txt
          echo "A PR ID reference will be added below for future uat → prod promotions." >> body.txt

      - name: Create PR into uat
        id: create_pr
        run: |
          BR="${{ steps.create_branch.outputs.branch }}"
          JIRA_ID="${{ env.jira_id }}"
          TITLE="[${JIRA_ID}] Promote changes from dev to uat (PR #${{ github.event.inputs.pr_number }})"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg head "$BR" \
            --arg base "uat" \
            --arg body "$(cat body.txt)" \
            '{title:$title, head:$head, base:$base, body:$body}')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls")

          echo "$RESPONSE" > created.json

          PR_NUM=$(jq -r '.number' created.json)
          if [ "$PR_NUM" = "null" ]; then
            echo "Error creating PR: $(jq -r '.message' created.json)" >&2
            exit 1
          fi

          echo "created_pr=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Update PR body with PR ID
        run: |
          PR="${{ steps.create_pr.outputs.created_pr }}"
          UPDATED=updated_body.txt

          cat body.txt > "$UPDATED"
          echo "" >> "$UPDATED"
          echo "UAT PR ID: $PR" >> "$UPDATED"
          echo "Retain this ID for uat → prod promotions." >> "$UPDATED"

          PAYLOAD=$(jq -n --arg body "$(cat $UPDATED)" '{body:$body}')

          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}" > /dev/null

      - name: Apply Jira and environment labels
        run: |
          PR="${{ steps.create_pr.outputs.created_pr }}"
          JIRA_ID="${{ env.jira_id }}"

          LABELS=$(jq -n --arg jira "$JIRA_ID" '{labels: [$jira, "dev-to-uat", "automated-promotion"]}')

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$LABELS" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR}/labels"

      - name: Completed
        run: |
          echo "Promotion Dev → UAT completed successfully."
          echo "UAT PR #${{ steps.create_pr.outputs.created_pr }} created using merge commit strategy"
